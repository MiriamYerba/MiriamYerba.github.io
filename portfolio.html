<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Proyectos disponibles</title>
  <link rel="stylesheet" href="../frontend/public/portfolio.css" />
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" />
</head>
<body>
<nav class="navbar">
 <button onclick="window.history.back()" class="btn-volver">
    <span class="material-symbols-outlined">arrow_back</span>
  </button>
  <div class="titulo-centrado">
    <h1>Proyectos Miriam</h1>
  </div>
</nav>



  <main>
    <div class="galeria" id="galeriaVisitante"></div>
  </main>

  <script>
    async function cargarProyectosVisitante() {
      const galeria = document.getElementById('galeriaVisitante');
      galeria.innerHTML = '';
      try {
const res = await fetch('./frontend/public/data/proyectos.json');
        const proyectos = await res.json();
        proyectos.forEach(p => {
          const imagen = (p.imagenes && p.imagenes[0]) ? p.imagenes[0] : 'placeholder.jpg';
          const card = document.createElement('div');
          card.className = 'card-proyecto';
          card.style.cursor = 'pointer';
          card.onclick = () => verDetalle(p.id);

          card.innerHTML  = `
<img src="/img_proyectos/${p.imagenes && p.imagenes[0] ? p.imagenes[0] : 'placeholder.jpg'}" alt="Proyecto">
            <div class="contenido">
              <h3>${p.descripcion}</h3>
              <p class="descripcion">${p.descripcionLarga || p.descripcion}</p>
            </div>
          `;
          galeria.appendChild(card);
        });
      } catch (err) {
        galeria.innerHTML = '<p>Error al cargar proyectos.</p>';
        console.error(err);
      }
    }

    function verDetalle(id) {
      window.location.href = `/proyecto.html?id=${id}`;
    }

    window.onload = cargarProyectosVisitante;
  </script>
</body>
</html>
